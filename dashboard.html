<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Spaans Leren</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .stat-card {
            background: var(--white);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-card h3 {
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card .number {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text);
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="logo">Spaans <span>Leren</span> - Dashboard</a>
            
            <a href="calendario-master.html" class="back-button">
                📅 Ir a Calendario Máster
            </a>
        </div>
    </header>

    <main>
        <div id="loading" class="loading">Cargando estadísticas... ⏳</div>
        
        <div id="dashboard" class="dashboard-grid" style="display: none;">
            <!-- TARJETA 1: TESTS -->
            <div class="stat-card">
                <div class="icon">📝</div>
                <h3>Tests Completados</h3>
                <div id="stat-tests" class="number">0</div>
            </div>

            <!-- TARJETA 2: VISITANTES (Modificada para ser clickeable) -->
            <div class="stat-card" onclick="verVisitantes()" style="cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                <div class="icon">👥</div>
                <h3>Visitantes Únicos</h3>
                <div id="stat-visitors" class="number">0</div>
                <div style="font-size: 0.8rem; color: var(--primary); margin-top: 10px;">👁️ Clic para ver IPs</div>
            </div>

            <!-- TARJETA 3: RESERVAS -->
            <div class="stat-card">
                <div class="icon">📅</div>
                <h3>Reservas Realizadas</h3>
                <div id="stat-reservations" class="number">0</div>
            </div>
        </div>

        <!-- MODAL PARA VER VISITANTES (Añadido aquí, antes de cerrar main) -->
        <div id="visitorsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
                <button onclick="cerrarVisitantes()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #666;">&times;</button>
                <h2 style="margin-top: 0; color: var(--primary); font-size: 1.5rem;">Lista de IPs</h2>
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Estas son las direcciones IP únicas que han entrado a la web:</p>
                <ul id="visitorsList" style="list-style-type: none; padding: 0; margin: 0;"></ul>
            </div>
        </div>
    </main>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_stats' })
                });
                const data = await response.json();

                if (data.ok) {
                    document.getElementById('stat-tests').textContent = data.tests;
                    document.getElementById('stat-visitors').textContent = data.visitors;
                    document.getElementById('stat-reservations').textContent = data.reservations;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'grid';
                } else {
                    document.getElementById('loading').textContent = 'Error al cargar los datos.';
                }
            } catch (error) {
                document.getElementById('loading').textContent = 'Error de conexión con el servidor.';
            }
        }

        fetchStats();

        /* =========================================
           NUEVAS FUNCIONES PARA VER LAS IPs
        ========================================= */
        
        async function verVisitantes() {
            const modal = document.getElementById('visitorsModal');
            const list = document.getElementById('visitorsList');
            
            // Mostrar el modal
            modal.style.display = 'flex';
            list.innerHTML = '<li>Cargando...</li>';

            try {
                // Llamar al worker para obtener las IPs
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_visitors' })
                });
                const data = await response.json();

              if (data.ok && data.visitors) {
                    list.innerHTML = '';
                    data.visitors.forEach((v, index) => {
                        const li = document.createElement('li');
                        li.style.padding = '10px';
                        li.style.borderBottom = '1px solid #eee';
                        li.style.fontFamily = 'sans-serif';
                        
                        // Aquí creamos el texto con la ciudad y el país
                        const location = v.city && v.country ? ` (${v.city}, ${v.country})` : '';
                        
                        // Y aquí lo insertamos en la lista
                        li.innerHTML = `<strong>${index + 1}. ${v.ip}</strong> <span style="color: #666; font-size: 0.9rem;">${location}</span>`;
                        
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<li>Error al cargar las IPs.</li>';
                }
            } catch (error) {
                list.innerHTML = '<li>Error de conexión con el servidor.</li>';
            }
        }

        function cerrarVisitantes() {
            document.getElementById('visitorsModal').style.display = 'none';
        }
    </script>
</body>
</html>
