<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Spaans Leren</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .stat-card {
            background: var(--white);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-card h3 {
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card .number {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text);
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header class="header">
        <!-- Añadimos display flex para separar el logo del botón -->
        <div class="container nav-container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="logo">Spaans <span>Leren</span> - Dashboard</a>
            
            <!-- NUEVO BOTÓN: Va al calendario privado -->
            <a href="calendario-master.html" class="back-button">
                📅 Ir a Calendario Máster
            </a>
        </div>
    </header>

    <main>
        <div id="loading" class="loading">Cargando estadísticas... ⏳</div>
        <div id="dashboard" class="dashboard-grid" style="display: none;">
            <div class="stat-card">
                <div class="icon">📝</div>
                <h3>Tests Completados</h3>
                <div id="stat-tests" class="number">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">👥</div>
                <h3>Visitantes Únicos</h3>
                <div id="stat-visitors" class="number">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">📅</div>
                <h3>Reservas Realizadas</h3>
                <div id="stat-reservations" class="number">0</div>
            </div>
        </div>
    </main>

    <script>
        // Protección básica: solo accesible si se pasa ?pass=gloria2024 en la URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('pass') !== 'gloria2024') {
            document.body.innerHTML = '<h1 style="text-align:center; margin-top:100px; color:red;">Acceso denegado</h1>';
            throw new Error('Acceso no autorizado');
        }

        async function fetchStats() {
            try {
                const response = await fetch('https://spaans-leren-chatbot.newpalma.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_stats' })
                });
                const data = await response.json();

                if (data.ok) {
                    document.getElementById('stat-tests').textContent = data.tests;
                    document.getElementById('stat-visitors').textContent = data.visitors;
                    document.getElementById('stat-reservations').textContent = data.reservations;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'grid';
                } else {
                    document.getElementById('loading').textContent = 'Error al cargar los datos.';
                }
            } catch (error) {
                document.getElementById('loading').textContent = 'Error de conexión con el servidor.';
            }
        }

        fetchStats();
    </script>
</body>
</html>
