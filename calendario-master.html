<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calendario Máster | Spaans Leren</title>

    <meta name="description"
          content="Calendario interno de reservas de Spaans Leren">
    <link rel="stylesheet" href="calendario-master.css">
    <script src="calendario-master.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8f9;
            color: #17252d;
        }

        /* =========================================
           CABECERA
        ========================================= */

        .master-header {
            background: #176b87;
            color: white;
            padding: 18px 20px;
        }

        .header-content {
            max-width: 1180px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 25px;
        }

        .header-title p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .back-button {
            display: inline-block;

            padding: 10px 16px;

            background: white;
            color: #176b87;

            text-decoration: none;

            border-radius: 7px;

            font-weight: bold;
            font-size: 14px;
        }

        .back-button:hover {
            background: #e7b65c;
            color: #17252d;
        }

        /* =========================================
           CONTENEDOR
        ========================================= */

        .master-container {
            max-width: 1180px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* =========================================
           PANEL SUPERIOR
        ========================================= */

        .control-panel {
            background: white;

            border: 1px solid #e1e8eb;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-controls button {
            border: none;

            background: #176b87;
            color: white;

            width: 40px;
            height: 40px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 20px;
        }

        .date-controls button:hover {
            background: #0f5067;
        }

        #currentDate {
            font-size: 19px;
            font-weight: bold;

            min-width: 210px;

            text-align: center;
        }

        /* =========================================
           LEYENDA
        ========================================= */

        .legend {
            display: flex;

            align-items: center;

            gap: 18px;

            flex-wrap: wrap;

            font-size: 14px;
        }

        .legend-item {
            display: flex;

            align-items: center;

            gap: 6px;
        }

        .legend-box {
            width: 17px;
            height: 17px;

            border-radius: 4px;

            border: 1px solid #ccc;
        }

        .legend-available {
            background: white;
        }

        .legend-pending {
            background: #e7b65c;
        }

        .legend-confirmed {
            background: #f4d6d6;
            border: 2px solid #d99a9a;
        }

        /* =========================================
           CALENDARIO
        ========================================= */

        .calendar-wrapper {
            background: white;

            border: 1px solid #e1e8eb;

            border-radius: 10px;

            overflow: hidden;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .calendar-weekdays {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            background: #f5f8f9;

            border-bottom: 1px solid #e1e8eb;
        }

        .weekday {
            padding: 13px 5px;

            text-align: center;

            font-weight: bold;

            font-size: 14px;
        }

        .calendar-grid {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);
        }

        .day {
            min-height: 115px;

            border-right: 1px solid #e1e8eb;
            border-bottom: 1px solid #e1e8eb;

            padding: 9px;

            cursor: pointer;

            transition: background 0.15s;
        }

        .day:nth-child(7n) {
            border-right: none;
        }

        .day:hover {
            background: #f5f8f9;
        }

        .day.empty {
            background: #fafbfc;
            cursor: default;
        }

        .day-number {
            font-weight: bold;

            font-size: 15px;

            margin-bottom: 8px;
        }

        /* =========================================
           RESERVAS DENTRO DEL DÍA
        ========================================= */

        .reservation {
            font-size: 12px;

            padding: 6px 7px;

            margin-bottom: 5px;

            border-radius: 5px;

            line-height: 1.3;
        }

        .reservation.pending {
            background: #e7b65c;

            color: #17252d;
        }

        .reservation.confirmed {
            background: #f4d6d6;

            border-left: 4px solid #d99a9a;

            color: #17252d;
        }

        .reservation-time {
            font-weight: bold;
        }

        .reservation-name {
            margin-top: 2px;
        }

        /* =========================================
           INFORMACIÓN DEL DÍA
        ========================================= */

        .day-details {
            margin-top: 20px;

            background: white;

            border: 1px solid #e1e8eb;

            border-radius: 10px;

            padding: 20px;
        }

        .day-details h2 {
            margin-top: 0;

            color: #176b87;

            font-size: 20px;
        }

        .no-reservations {
            color: #666;

            font-size: 14px;
        }

        /* =========================================
           RESERVA DETALLADA
        ========================================= */

        .reservation-detail {
            border: 1px solid #e1e8eb;

            border-radius: 8px;

            padding: 15px;

            margin-bottom: 12px;
        }

        .reservation-detail.pending {
            border-left: 5px solid #e7b65c;
        }

        .reservation-detail.confirmed {
            border-left: 5px solid #d99a9a;
        }

        .reservation-detail strong {
            color: #176b87;
        }

        .reservation-actions {
            margin-top: 12px;

            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }

        .action-button {
            border: none;

            border-radius: 6px;

            padding: 9px 13px;

            cursor: pointer;

            font-weight: bold;
        }

        .confirm-button {
            background: #176b87;
            color: white;
        }

        .cancel-button {
            background: #eee;
            color: #17252d;
        }

        .action-button:hover {
            opacity: 0.85;
        }

        /* =========================================
           ESTADO DEL SISTEMA
        ========================================= */

        .system-status {
            margin-top: 20px;

            text-align: center;

            font-size: 13px;

            color: #666;
        }

        /* =========================================
           MÓVIL
        ========================================= */

        @media (max-width: 768px) {

            .header-content {
                align-items: flex-start;

                flex-direction: column;
            }

            .back-button {
                width: 100%;

                text-align: center;
            }

            .control-panel {
                align-items: stretch;

                flex-direction: column;
            }

            .date-controls {
                justify-content: center;
            }

            #currentDate {
                min-width: auto;

                flex: 1;
            }

            .legend {
                justify-content: center;
            }

            .weekday {
                font-size: 11px;

                padding: 10px 2px;
            }

            .day {
                min-height: 90px;

                padding: 5px;
            }

            .day-number {
                font-size: 13px;
            }

            .reservation {
                font-size: 10px;

                padding: 4px;
            }

        }

    </style>

</head>


<body>

    <!-- =========================================
         CABECERA
    ========================================= -->

    <header class="master-header">

        <div class="header-content">

            <div class="header-title">

                <h1>Calendario Máster</h1>

                <p>
                    Gestión interna de reservas · Spaans Leren
                </p>

            </div>

            <a
                href="calendario.html"
                class="back-button"
            >
                ← Calendario público
            </a>

        </div>

    </header>


    <!-- =========================================
         CONTENIDO
    ========================================= -->

    <main class="master-container">


        <!-- =====================================
             CONTROLES
        ====================================== -->

        <section class="control-panel">

            <div class="date-controls">

                <button
                    id="previousMonth"
                    type="button"
                    aria-label="Mes anterior"
                >
                    ‹
                </button>

                <div id="currentDate">
                    Octubre 2026
                </div>

                <button
                    id="nextMonth"
                    type="button"
                    aria-label="Mes siguiente"
                >
                    ›
                </button>

            </div>


            <div class="legend">

                <div class="legend-item">

                    <span
                        class="legend-box legend-available"
                    ></span>

                    Disponible

                </div>


                <div class="legend-item">

                    <span
                        class="legend-box legend-pending"
                    ></span>

                    Pre-reserva

                </div>


                <div class="legend-item">

                    <span
                        class="legend-box legend-confirmed"
                    ></span>

                    Confirmada

                </div>

            </div>

        </section>


        <!-- =====================================
             CALENDARIO
        ====================================== -->

        <section class="calendar-wrapper">

            <div class="calendar-weekdays">

                <div class="weekday">Lun</div>
                <div class="weekday">Mar</div>
                <div class="weekday">Mié</div>
                <div class="weekday">Jue</div>
                <div class="weekday">Vie</div>
                <div class="weekday">Sáb</div>
                <div class="weekday">Dom</div>

            </div>


            <div
                id="calendarGrid"
                class="calendar-grid"
            >

                <!--
                    El calendario se generará
                    mediante JavaScript.
                -->

            </div>

        </section>


        <!-- =====================================
             DETALLES DEL DÍA
        ====================================== -->

        <section class="day-details">

            <h2 id="selectedDayTitle">
                Selecciona un día
            </h2>

            <div id="dayReservations">

                <p class="no-reservations">
                      Cargando reservas...
                </p>

            </div>

        </section>

<!-- =========================================
     TODAS LAS RESERVAS
========================================= -->

<section class="all-reservations">

    <h2>
        Todas las reservas
    </h2>

    <div id="allReservations">

        <p class="no-reservations">
            Cargando reservas...
        </p>

    </div>

</section>
        
        <div class="system-status">

            Calendario Máster · Conexión con D1 pendiente

        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        /* =========================================
           FECHA ACTUAL
        ========================================= */

        let currentDate = new Date();

        let selectedDate = null;


        /* =========================================
           ELEMENTOS
        ========================================= */

        const calendarGrid =
            document.getElementById("calendarGrid");

        const currentDateElement =
            document.getElementById("currentDate");

        const previousMonthButton =
            document.getElementById("previousMonth");

        const nextMonthButton =
            document.getElementById("nextMonth");

        const selectedDayTitle =
            document.getElementById("selectedDayTitle");

        const dayReservations =
            document.getElementById("dayReservations");


        /* =========================================
           NOMBRES DE LOS MESES
        ========================================= */

        const monthNames = [
            "Enero",
            "Febrero",
            "Marzo",
            "Abril",
            "Mayo",
            "Junio",
            "Julio",
            "Agosto",
            "Septiembre",
            "Octubre",
            "Noviembre",
            "Diciembre"
        ];


        /* =========================================
           MOSTRAR CALENDARIO
        ========================================= */

        function renderCalendar() {

            calendarGrid.innerHTML = "";

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();


            currentDateElement.textContent =
                `${monthNames[month]} ${year}`;


            /*
                Primer día del mes.

                JavaScript:
                Domingo = 0
                Lunes = 1

                Lo convertimos para que
                la semana empiece en lunes.
            */

            let firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();

            firstDay =
                firstDay === 0
                    ? 6
                    : firstDay - 1;


            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /* =====================================
               ESPACIOS ANTES DEL PRIMER DÍA
            ====================================== */

            for (
                let i = 0;
                i < firstDay;
                i++
            ) {

                const emptyDay =
                    document.createElement("div");

                emptyDay.className =
                    "day empty";

                calendarGrid.appendChild(
                    emptyDay
                );

            }


            /* =====================================
               CREAR DÍAS
            ====================================== */

            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const dayElement =
                    document.createElement("div");

                dayElement.className =
                    "day";


                const dayNumber =
                    document.createElement("div");

                dayNumber.className =
                    "day-number";

                dayNumber.textContent =
                    day;


                dayElement.appendChild(
                    dayNumber
                );


                /*
                    AQUÍ MÁS ADELANTE
                    CARGAREMOS LAS RESERVAS
                    REALES DESDE D1.
                */


                dayElement.addEventListener(
                    "click",
                    () => {

                        selectDay(
                            year,
                            month,
                            day
                        );

                    }
                );


                calendarGrid.appendChild(
                    dayElement
                );

            }

        }


        /* =========================================
           SELECCIONAR DÍA
        ========================================= */

        function selectDay(
            year,
            month,
            day
        ) {

            selectedDate =
                new Date(
                    year,
                    month,
                    day
                );


            const formattedDate =
                `${day.toString().padStart(2, "0")}/` +
                `${(month + 1).toString().padStart(2, "0")}/` +
                `${year}`;


            selectedDayTitle.textContent =
                `Reservas del ${formattedDate}`;


            dayReservations.innerHTML = `

                <p class="no-reservations">
                    Todavía no hay datos conectados
                    al sistema D1.
                </p>

            `;

        }


        /* =========================================
           MES ANTERIOR
        ========================================= */

        previousMonthButton.addEventListener(
            "click",
            () => {

                currentDate.setMonth(
                    currentDate.getMonth() - 1
                );

                renderCalendar();

            }
        );


        /* =========================================
           MES SIGUIENTE
        ========================================= */

        nextMonthButton.addEventListener(
            "click",
            () => {

                currentDate.setMonth(
                    currentDate.getMonth() + 1
                );

                renderCalendar();

            }
        );


        /* =========================================
           INICIAR
        ========================================= */

        renderCalendar();

    </script>

</body>

</html>
