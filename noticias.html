<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias y Novedades | Spaans met Gloria</title>
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="style.css">
    
    <style>
        /* SOLO PARA ESTA PÁGINA: Marca de agua con el logo */
        body.subpage {
            position: relative;
            background-color: #f8f9fa; /* Un fondo gris muy suave para que resalte el blanco de las noticias */
        }

        body.subpage::before {
            content: "";
            position: fixed; /* Se queda fijo aunque hagas scroll */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Lo centra perfectamente */
            
            /* Ajusta el tamaño del logo aquí */
            width: 80vw; 
            max-width: 800px; 
            height: 80vh; 
            
            /* RUTA DE TU LOGO */
            background-image: url('images/logo4.png'); 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            /* LA MAGIA DEL FUNDIDO */
            opacity: 0.1; /* 0.05 es casi invisible. Súbelo a 0.1 o 0.15 si lo quieres más visible */
            
            z-index: -1; /* Lo manda detrás de todo el contenido */
            pointer-events: none; /* Evita que el usuario haga clic en el logo sin querer */
        }
        
        /* Aseguramos que el contenido esté por encima del logo */
        main, header.header, footer.footer {
            position: relative;
            z-index: 1;
        }

        /* En móviles, lo hacemos un poco más pequeño para que no sature */
        @media (max-width: 768px) {
            body.subpage::before {
                width: 120vw; 
                opacity: 0.03;
            }
        }
    </style>
</head>
<body class="subpage">

    <!-- HEADER -->
    <header class="header">
        <div class="container nav-container">

            <!-- Arreglado el doble span del logo -->
            <a href="index.html#inicio" class="logo">
                Spaans <span>met Gloria</span>
            </a>

            <button class="menu-button" id="menuButton" aria-label="Abrir menú">
                ☰
            </button>

            <nav class="nav" id="navMenu">
                <a href="index.html#inicio" data-i18n="navInicio">Inicio</a>
                <a href="index.html#cursos" data-i18n="navCursos">Cursos</a>
                <a href="index.html#precios" data-i18n="navPrecios">Precios</a>
                <a href="calendario.html" data-i18n="navCalendario">Calendario</a>
                <a href="test.html" data-i18n="navtest">Test de nivel</a>
                <a href="index.html#contacto" data-i18n="navContacto">Contacto</a>

                <div class="language-selector">
                    <button type="button" id="languageToggle" aria-label="Cambiar idioma">
                        🇳🇱 🇪🇸
                    </button>
                </div>
            </nav>

        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <!-- He vuelto a abrir este contenedor para que todo quede centrado -->
    <div style="text-align: center; width: 100%; max-width: 800px; padding: 0 20px; margin: 0 auto;">
        
        <h1 style="font-size: 3rem; margin-top: 40px; margin-bottom: 15px; color: #17252d;" data-i18n="noticiasTitle">Noticias y Novedades</h1>
        <p style="color: #666; margin-bottom: 40px;" data-i18n="noticiasIntro">Mantente al día sobre clases, eventos y consejos para aprender español.</p>

        <!-- Aquí se cargarán las noticias -->
        <div id="newsContainer" style="display: flex; flex-direction: column; gap: 30px; text-align: left;">
            <p style="text-align: center; color: #999;">Cargando noticias...</p>
        </div>

    </div> <!-- Cerramos el contenedor principal -->

    <!-- FOOTER -->
    <footer class="footer" style="background-color: #17252d; padding: 30px 20px; margin-top: 60px; position: static;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%;">
            
            <!-- COPYRIGHT -->
            <p class="footer-copy" style="margin-bottom: 15px; color: #d9e4e8; font-size: 0.9rem;">
                © <span id="year"></span> Spaans met Gloria. Todos los derechos reservados.
            </p>
       
            <!-- CREATED BY -->
            <a href="https://flowtalkia.com" target="_blank" style="display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
                <span style="color: #a0aec0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;">Created by</span>
                <img src="images/frowtalkiaLSmall.png" alt="Flowtalkia" style="height: 30px; width: auto; object-fit: contain;">
            </a>

        </div> <!-- Cerramos el contenedor del footer -->
    </footer>

    <!-- SCRIPTS -->
    <script src="script.js"></script> <!-- Enlazamos tu script global (menú móvil, etc) -->
    
    <script>
        async function cargarNoticias() {
            const container = document.getElementById('newsContainer');
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_news' })
                });
                const data = await res.json();

                if (data.ok && data.news.length > 0) {
                    container.innerHTML = '';
                    data.news.forEach(item => {
                        const date = new Date(item.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
                        
                        const imgHtml = item.image_url ? `<img src="${item.image_url}" alt="Imagen de noticia" style="width: 100%; height: 250px; object-fit: cover; border-radius: 12px 12px 0 0;">` : '';

                        container.innerHTML += `
                            <article style="background: white; border: 1px solid #e1e8eb; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                                ${imgHtml}
                                <div style="padding: 25px;">
                                    <p style="color: #999; font-size: 0.85rem; margin-bottom: 5px;">${date}</p>
                                    <h2 style="color: #17252d; font-size: 1.5rem; margin-bottom: 15px;">${item.title}</h2>
                                    <p style="color: #44545c; line-height: 1.6; white-space: pre-wrap;">${item.content}</p>
                                </div>
                            </article>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #999;">Todavía no hay noticias publicadas.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="text-align: center; color: red;">Error al cargar las noticias.</p>';
            }
        }

        // Iniciar carga
        cargarNoticias();
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
