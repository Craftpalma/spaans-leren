<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias y Novedades | Spaans met Gloria</title>
    
    <!-- Hoja de estilos (solo una vez) -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* SOLO PARA ESTA PÁGINA: Marca de agua con el logo */
        body.subpage {
            position: relative;
            background-color: #f8f9fa; 
        }

        body.subpage::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; 
            max-width: 800px; 
            height: 80vh; 
            background-image: url('images/logo4.png'); 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.1; 
            z-index: -1; 
            pointer-events: none; 
        }
        
        main, header.header, footer.footer {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            body.subpage::before {
                width: 120vw; 
                opacity: 0.03;
            }
        }
    </style>
</head>
<body class="subpage">

    <!-- HEADER -->
    <header class="header">
        <div class="container nav-container">

            <a href="index.html#inicio" class="logo">
                Spaans <span>met Gloria</span>
            </a>

            <button class="menu-button" id="menuButton" aria-label="Abrir menú">
                ☰
            </button>

            <nav class="nav" id="navMenu">
                <a href="index.html#inicio" data-i18n="navInicio">Inicio</a>
                <a href="index.html#cursos" data-i18n="navCursos">Cursos</a>
                <a href="index.html#precios" data-i18n="navPrecios">Precios</a>
                <a href="calendario.html" data-i18n="navCalendario">Calendario</a>
                <a href="test.html" data-i18n="navtest">Test de nivel</a>
                <a href="index.html#contacto" data-i18n="navContacto">Contacto</a>

                <div class="language-selector">
                    <button type="button" id="languageToggle" aria-label="Cambiar idioma">
                        🇳🇱 🇪🇸
                    </button>
                </div>
            </nav>

        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div style="text-align: center; width: 100%; max-width: 800px; padding: 0 20px; margin: 0 auto;">
        
        <h1 style="font-size: 3rem; margin-top: 40px; margin-bottom: 15px; color: #17252d;" data-i18n="noticiasTitle">Noticias y Novedades</h1>
        <p style="color: #666; margin-bottom: 40px;" data-i18n="noticiasIntro">Mantente al día sobre clases, eventos y consejos para aprender español.</p>

        <!-- Aquí se cargarán las noticias -->
        <div id="newsContainer" style="display: flex; flex-direction: column; gap: 30px; text-align: left;">
            <p style="text-align: center; color: #999;">Cargando noticias...</p>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="footer" style="background-color: #17252d; padding: 30px 20px; margin-top: 60px; position: static;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%;">
            
            <p class="footer-copy" style="margin-bottom: 15px; color: #d9e4e8; font-size: 0.9rem;">
                © <span id="year"></span> Spaans met Gloria. Todos los derechos reservados.
            </p>
       
            <a href="https://flowtalkia.com" target="_blank" style="display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
                <span style="color: #a0aec0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;">Created by</span>
                <img src="images/frowtalkiaLSmall.png" alt="Flowtalkia" style="height: 30px; width: auto; object-fit: contain;">
            </a>

        </div> 
    </footer>
    <!-- MODAL SOLO PARA AMPLIAR LA IMAGEN -->
    <div id="imageModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; cursor: zoom-out;" onclick="cerrarImagen()">
        <!-- Botón de cerrar -->
        <button style="position: absolute; top: 20px; right: 20px; background: white; color: black; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; font-weight: bold;">✕</button>
        
        <!-- Imagen ampliada -->
        <img id="expandedImage" src="" alt="Imagen ampliada" style="max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
    </div>

    <!-- SCRIPTS -->
    <script src="script.js"></script>
        <script>
        async function cargarNoticias() {
            const container = document.getElementById('newsContainer');
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_news' })
                });
                const data = await res.json();

                if (data.ok && data.news.length > 0) {
                    container.innerHTML = '';
                    
                    data.news.forEach(item => {
                        const date = item.created_at ? new Date(item.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
                        
                        const article = document.createElement('article');
                        article.style.cssText = "background: white; border: 1px solid #e1e8eb; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);";
                        
                        // Si tiene imagen, le añadimos el evento de clic SOLO a la imagen
                        let imgHtml = '';
                        if (item.image_url) {
                            imgHtml = `
                                <div style="overflow: hidden;">
                                    <img src="${item.image_url}" alt="Imagen de noticia" 
                                         style="width: 100%; height: auto; max-height: 400px; object-fit: contain; background-color: #f8f9fa; cursor: zoom-in; transition: transform 0.3s;" 
                                         onmouseover="this.style.transform='scale(1.02)'" 
                                         onmouseout="this.style.transform='scale(1)'"
                                         onclick="abrirImagen('${item.image_url}')">
                                </div>
                            `;
                        }

                        // El texto de la noticia ahora se muestra completo (sin "Leer más")
                        article.innerHTML = `
                            ${imgHtml}
                            <div style="padding: 25px;">
                                <p style="color: #999; font-size: 0.85rem; margin-bottom: 5px;">${date}</p>
                                <h2 style="color: #17252d; font-size: 1.5rem; margin-bottom: 15px;">${item.title}</h2>
                                <p style="color: #44545c; line-height: 1.6; white-space: pre-wrap;">${item.content}</p>
                            </div>
                        `;

                        container.appendChild(article);
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #999;">Todavía no hay noticias publicadas.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="text-align: center; color: red;">Error al cargar las noticias.</p>';
            }
        }

        // Funciones para abrir y cerrar la imagen ampliada
        function abrirImagen(url) {
            document.getElementById('expandedImage').src = url;
            document.getElementById('imageModal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Bloquea el scroll de la página
        }

        function cerrarImagen() {
            document.getElementById('imageModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Devuelve el scroll
        }

        // Iniciar carga
        cargarNoticias();
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
   
</body>
</html>
